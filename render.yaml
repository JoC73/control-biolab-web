services:
  - type: web
    name: control-biolab
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Control BIOLAB
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: control-biolab-db
          property: connectionString

databases:
  - name: control-biolab-db
    plan: free
